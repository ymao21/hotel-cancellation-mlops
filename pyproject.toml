[project]
name = "hotel-cancellation-mlops"
version = "0.1.0"
description = "Predict hotel booking cancellations with an end-to-end MLOps pipeline"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
