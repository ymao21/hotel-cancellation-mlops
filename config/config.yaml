# Single source of truth for the project.
# Paths are relative to the project root (absolute paths also work).

project:
  name: hotel-cancellation-mlops
  random_seed: 42

paths:
  raw_data: data/raw/hotel_bookings.csv
  clean_data: data/processed/hotel_bookings_clean.csv
  train: data/processed/train.csv
  test: data/processed/test.csv
  reports_dir: reports
  figures_dir: reports/figures
  metrics_dir: reports/metrics
  mlflow_artifacts: mlartifacts   # where a local (sqlite) MLflow store keeps model files

target: is_canceled

cleaning:
  # Columns that are only known AFTER the outcome -> they leak the target.
  leakage_columns:
    - reservation_status        # Canceled / Check-Out / No-Show = the answer
    - reservation_status_date   # date the status was set (after the outcome)
    - assigned_room_type        # assigned at check-in, not known at booking time
    - required_car_parking_spaces  # 0 of 7,416 bookings with a parking request were
                                   # canceled: likely only filled in at check-in
  # The raw file has 31,994 exact duplicate rows (about 33k once the leakage
  # columns are dropped). Duplicates that land in both train and test inflate the
  # test score, so we drop them by default. This is the last cleaning step.
  drop_duplicates: true
  max_adr: 5000                 # one extreme outlier (adr = 5400) is removed

split:
  method: random                # random (stratified) | time
  test_size: 0.2
  time_cutoff: "2017-04-01"     # only used when method == time

features:
  numeric:
    - lead_time
    - arrival_date_week_number
    - arrival_date_day_of_month
    - arrival_month_num
    - stays_in_weekend_nights
    - stays_in_week_nights
    - total_nights
    - adults
    - children
    - babies
    - total_guests
    - is_repeated_guest
    - previous_cancellations
    - previous_bookings_not_canceled
    - booking_changes
    - days_in_waiting_list
    - adr
    - total_of_special_requests
    - has_agent
    - has_company
  categorical:
    - hotel
    - meal
    - country
    - market_segment
    - distribution_channel
    - reserved_room_type
    - deposit_type
    - customer_type
    - arrival_weekday
  # Rare categories (e.g. small countries) are grouped into "infrequent" by the
  # encoder, which is fit on the TRAIN set only (no leakage from test).
  max_categories: 25

metric:
  primary: roc_auc              # model selection metric (AutoML objective too)
  threshold: 0.5                # decision threshold for F1 / precision / recall
  # Illustrative business costs (per booking) for the "expected cost" view.
  cost_false_negative: 100      # missed cancellation -> empty room / lost revenue
  cost_false_positive: 150      # predicted cancel but guest arrives -> overbooking

training:
  experiment_name: hotel-cancellation     # MLflow experiment
  # Where MLflow keeps runs. A relative sqlite path is resolved from the project root.
  # The MLFLOW_TRACKING_URI environment variable wins (Docker sets http://mlflow:5000).
  tracking_uri: sqlite:///mlflow.db
  registered_model_name: hotel_cancel_model
  model_alias: champion         # deployment loads models:/hotel_cancel_model@champion
  # Quality gate: only register the model if its test ROC-AUC beats the
  # logistic-regression baseline by at least `min_gain_over_baseline`.
  require_beat_baseline: true
  min_gain_over_baseline: 0.0
  permutation_repeats: 5        # repeats for the feature-importance chart
  automl:
    time_budget_s: 300          # FLAML search time (seconds)
    eval_method: cv
    n_splits: 5                 # 5-fold cross-validation on the TRAIN set only
    # Algorithm families FLAML compares (FLAML codes, see src/labels.py)
    estimators: [lgbm, xgboost, rf, extra_tree, lrl1]
